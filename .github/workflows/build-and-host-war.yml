# ---------------------------------------------------------------------------
# Builds the single deployable WAR and *hosts it on Apache Tomcat 11* on a clean
# machine, then smoke-tests the running application.
#
# Why this workflow exists: the development sandbox has no JDK/Maven/Tomcat and no
# route to Maven Central (docs/operations/sandbox-environment.md), so the only place
# the build and the Tomcat deployment can actually be executed is a normal runner.
# This is the "run it for real" path — it produces the artefact, the deployment log
# and the HTTP evidence, instead of an assertion that it would work.
#
# It runs on every push that touches code, the build scripts, or this workflow, and
# can be started manually from the Actions tab.
# ---------------------------------------------------------------------------
name: build-and-host-war

on:
  workflow_dispatch:
  push:
    branches:
      - "arena/**"
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/**"
      - "deploy/**"
      - ".github/workflows/build-and-host-war.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: host-war-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-host:
    name: Build WAR, deploy to Tomcat 11, smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root_pw_for_ci_only
          MARIADB_DATABASE: infeara_sales
          MARIADB_USER: infeara_app
          MARIADB_PASSWORD: ci_app_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    env:
      TOMCAT_VERSION: "11.0.27"
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_NAME: infeara_sales
      DB_USER: infeara_app
      DB_PASSWORD: ci_app_password

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Toolchain versions
        run: |
          java -version
          javac -version
          mvn -v
          node -v
          python3 -V

      - name: Frontend type-check, unit tests and static export
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npx vitest run
          npm run build

      - name: Build the WAR
        working-directory: backend
        run: |
          set -o pipefail
          mvn -B -ntp clean package -DskipTests 2>&1 | tee /tmp/mvn.log

      - name: Backend unit and architecture tests
        working-directory: backend
        run: |
          set -o pipefail
          mvn -B -ntp test 2>&1 | tee /tmp/test.log | tail -60

      - name: Prove the static checkers still detect defects
        run: |
          python3 scripts/validate-migrations-selftest.py
          python3 scripts/verify-war-selftest.py | tail -5

      - name: Validate the Flyway script set
        run: python3 scripts/validate-migrations.py

      - name: Cross-check the entity model against the schema
        run: python3 scripts/validate-entities.py

      - name: Verify the packaging contract
        run: |
          set -o pipefail
          python3 scripts/verify-war.py backend/target/infeara-sales-os.war 2>&1 | tee /tmp/verify.log

      - name: Download Apache Tomcat 11
        run: |
          curl -fsSL --retry 3 -o /tmp/tomcat.tgz \
            "https://archive.apache.org/dist/tomcat/tomcat-11/v${TOMCAT_VERSION}/bin/apache-tomcat-${TOMCAT_VERSION}.tar.gz"
          mkdir -p /opt/tomcat
          tar -xzf /tmp/tomcat.tgz -C /opt/tomcat --strip-components=1
          rm -rf /opt/tomcat/webapps/*
          /opt/tomcat/bin/version.sh

      - name: Deploy ROOT.war and start Tomcat
        run: |
          cp backend/target/infeara-sales-os.war /opt/tomcat/webapps/ROOT.war
          cat > /opt/tomcat/bin/setenv.sh <<'SETENV'
          export JAVA_HOME="${JAVA_HOME}"
          export CATALINA_OPTS="-Xms256m -Xmx768m -Dfile.encoding=UTF-8 -Duser.timezone=UTC"
          export SPRING_PROFILES_ACTIVE=prod
          export DB_HOST="127.0.0.1"
          export DB_PORT="3306"
          export DB_NAME="infeara_sales"
          export DB_USER="infeara_app"
          export DB_PASSWORD="ci_app_password"
          export APP_BASE_URL="http://localhost:8080"
          export SMTP_SECRET_ENCRYPTION_KEY="$(openssl rand -base64 32)"
          export SMTP_SECRET_ENCRYPTION_KEY_ID="ci1"
          export BOOTSTRAP_WORKSPACE_NAME="Infeara Technologies"
          export BOOTSTRAP_WORKSPACE_SLUG="infeara"
          export BOOTSTRAP_ADMIN_EMAIL="ci-admin@infeara.local"
          export BOOTSTRAP_ADMIN_PASSWORD="CiOnly-Passw0rd!2026"
          export WORKER_ENABLED="true"
          SETENV
          chmod +x /opt/tomcat/bin/setenv.sh
          /opt/tomcat/bin/startup.sh
          echo "Tomcat started, waiting for the application to report UP"

      - name: Wait for /actuator/health and collect evidence
        run: |
          for attempt in $(seq 1 90); do
            if curl -fsS -o /tmp/health.json http://localhost:8080/actuator/health; then
              if grep -q '"status":"UP"' /tmp/health.json; then
                echo "Application UP after ${attempt}s"; cat /tmp/health.json; exit 0
              fi
            fi
            sleep 2
          done
          echo "::error::Application did not become healthy"
          tail -n 200 /opt/tomcat/logs/catalina.out || true
          exit 1

      - name: Smoke test the deployed WAR (UI + API + OpenAPI)
        run: |
          set -e
          echo "--- GET / (UI) ---"
          curl -s -o /tmp/index.html -w "http=%{http_code} bytes=%{size_download}\n" http://localhost:8080/
          grep -qi "<html" /tmp/index.html && echo "UI HTML served"
          echo "--- GET /engagement/mailbox/ (deep link) ---"
          curl -s -o /dev/null -w "http=%{http_code}\n" http://localhost:8080/engagement/mailbox/
          echo "--- GET /_next/ (hashed asset) ---"
          asset=$(grep -o '/_next/static/[^"]*\.js' /tmp/index.html | head -1)
          curl -s -o /dev/null -w "asset=$asset http=%{http_code}\n" "http://localhost:8080${asset}"
          echo "--- GET /api/v1/auth/me (expect 401 JSON envelope) ---"
          curl -s -w "\nhttp=%{http_code}\n" http://localhost:8080/api/v1/auth/me
          echo "--- GET /v3/api-docs ---"
          curl -s -o /dev/null -w "http=%{http_code}\n" http://localhost:8080/v3/api-docs
          echo "--- Flyway schema check ---"
          mariadb --version >/dev/null 2>&1 || true
          python3 - <<'PY'
          import json, urllib.request
          with urllib.request.urlopen("http://localhost:8080/v3/api-docs", timeout=30) as response:
              spec = json.load(response)
          paths = sorted(spec.get("paths", {}))
          print(f"OpenAPI paths: {len(paths)}")
          for path in [p for p in paths if "/email" in p][:30]:
              print("  ", path)
          PY

      - name: Authenticated smoke test (MFA enrolment, module reads, CSRF-protected write)
        run: |
          set -o pipefail
          python3 scripts/smoke-authenticated.py \
            --base-url http://localhost:8080 \
            --email ci-admin@infeara.local \
            --password 'CiOnly-Passw0rd!2026' 2>&1 | tee /tmp/auth-smoke.log

      - name: Deployed schema inventory
        run: |
          sudo apt-get install -y -qq mariadb-client >/dev/null 2>&1 || true
          mariadb -h 127.0.0.1 -u infeara_app -pci_app_password infeara_sales \
            -e "SELECT COUNT(*) AS tables_created FROM information_schema.tables WHERE table_schema='infeara_sales';
                SELECT version, success FROM flyway_schema_history ORDER BY installed_rank;" || true

      - name: Collect deployment evidence
        if: always()
        run: |
          set +e
          {
            echo "#### Runtime evidence (Tomcat 11, single ROOT.war, http://localhost:8080)"
            echo '```'
            echo "GET /actuator/health  -> $(curl -s -m 15 http://localhost:8080/actuator/health)"
            echo "GET /                 -> $(curl -s -m 15 -o /tmp/probe.html -w '%{http_code}' http://localhost:8080/) bytes=$(wc -c < /tmp/probe.html 2>/dev/null)"
            echo "GET /leads/           -> $(curl -s -m 15 -o /dev/null -w '%{http_code}' http://localhost:8080/leads/)"
            echo "GET /engagement/mailbox/ -> $(curl -s -m 15 -o /dev/null -w '%{http_code}' http://localhost:8080/engagement/mailbox/)"
            echo "GET /api/v1/auth/me   -> $(curl -s -m 15 -w ' http=%{http_code}' http://localhost:8080/api/v1/auth/me)"
            echo "GET /v3/api-docs      -> $(curl -s -m 30 -o /tmp/openapi.json -w '%{http_code}' http://localhost:8080/v3/api-docs)"
            echo "OpenAPI paths         -> $(grep -o '\"/api/[^\"]*\"' /tmp/openapi.json 2>/dev/null | sort -u | wc -l)"
            echo '```'
            echo
            echo "#### Authenticated end-to-end smoke (login -> MFA enrolment -> module reads -> CSRF write)"
            echo '```'
            cat /tmp/auth-smoke.log 2>/dev/null || echo "not reached"
            echo '```'
            echo
            echo "#### Backend test suite (gates the build)"
            echo '```'
            grep -E "Tests run:|BUILD (SUCCESS|FAILURE)" /tmp/test.log 2>/dev/null | head -12
            grep -A 4 "Architecture Violation" /tmp/test.log 2>/dev/null | head -40
            grep -E "^\[ERROR\]   [A-Z][A-Za-z]*(Test|IT)\." /tmp/test.log 2>/dev/null | head -10
            echo '```'
            echo
            echo "#### Authenticated API through the same WAR"
            echo '```'
            echo "POST /api/v1/auth/login -> $(curl -s -m 20 -c /tmp/cookies.txt -o /tmp/login.json \
              -w '%{http_code}' -H 'Content-Type: application/json' \
              -d '{"email":"ci-admin@infeara.local","password":"CiOnly-Passw0rd!2026"}' \
              http://localhost:8080/api/v1/auth/login)"
            echo "response: $(head -c 400 /tmp/login.json)"
            echo "GET /api/v1/leads -> $(curl -s -m 20 -b /tmp/cookies.txt -o /tmp/leads.json \
              -w '%{http_code}' http://localhost:8080/api/v1/leads)"
            echo "response: $(head -c 400 /tmp/leads.json)"
            echo "GET /api/v1/email/accounts -> $(curl -s -m 20 -b /tmp/cookies.txt -o /tmp/accounts.json \
              -w '%{http_code}' http://localhost:8080/api/v1/email/accounts)"
            echo "response: $(head -c 400 /tmp/accounts.json)"
            echo '```'
            echo
            echo "#### Database after the first boot"
            echo '```'
            mariadb -h 127.0.0.1 -u infeara_app -pci_app_password infeara_sales \
              -e "SELECT COUNT(*) AS tables_created FROM information_schema.tables WHERE table_schema='infeara_sales';" 2>/dev/null
            mariadb -h 127.0.0.1 -u infeara_app -pci_app_password infeara_sales \
              -e "SELECT version, description, success FROM flyway_schema_history ORDER BY installed_rank;" 2>/dev/null
            mariadb -h 127.0.0.1 -u infeara_app -pci_app_password infeara_sales \
              -e "SELECT (SELECT COUNT(*) FROM capabilities) AS capabilities, (SELECT COUNT(*) FROM roles) AS roles, (SELECT COUNT(*) FROM users) AS users, (SELECT COUNT(*) FROM audit_logs) AS audit_rows;" 2>/dev/null
            echo '```'
          } > /tmp/evidence.md 2>&1
          cat /tmp/evidence.md

      - name: Publish the build/startup report to the tracking issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          REPORT=/tmp/report.md
          {
            echo "### Run ${{ github.run_id }} — ${{ job.status }}"
            echo
            echo "Ref: \`${{ github.ref_name }}\` · commit \`${GITHUB_SHA:0:8}\` · [job](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo
            if [ -f /tmp/mvn.log ] && [ "${{ job.status }}" != "success" ]; then
              echo "Compiler diagnostics (deduplicated, first 220):"
              echo '```'
              grep -E "^\[ERROR\].*\.java:\[" /tmp/mvn.log | sed -E 's#.*/com/infeara/sales/##' | sort -u | head -220
              echo '```'
              echo
              echo "Files with errors: $(grep -oE '/com/infeara/sales/[^:]*\.java' /tmp/mvn.log | sort -u | wc -l)"
              echo
              echo "Tail:"
              echo '```'
              grep -E "BUILD FAILURE|ERROR\] Failed to execute|Total time" /tmp/mvn.log | head -10
              echo '```'
            fi
            if [ -f /tmp/verify.log ]; then
              echo "WAR verification:"
              echo '```'
              tail -n 40 /tmp/verify.log
              echo '```'
            fi
            if [ -f /tmp/evidence.md ]; then
              cat /tmp/evidence.md
              echo
            fi
            if [ -f /opt/tomcat/logs/catalina.out ] && [ "${{ job.status }}" != "success" ]; then
              echo "Flyway / startup error detail:"
              echo '```'
              grep -n -B 4 -A 6 -E "SQL State|Error Code|Message *:|Migration .* failed|Migration V[0-9]+" \
                /opt/tomcat/logs/catalina.out | tail -n 70
              echo '```'
              echo "Tomcat log tail:"
              echo '```'
              tail -n 120 /opt/tomcat/logs/catalina.out
              echo '```'
            fi
          } > "$REPORT"
          echo "report bytes: $(wc -c < "$REPORT")"
          head -c 2000 "$REPORT" || true
          if [ -s "$REPORT" ]; then
            gh api "repos/${{ github.repository }}/issues/1/comments" \
              -F "body=@$REPORT" >/dev/null && echo "report posted to issue #1"
          else
            gh api "repos/${{ github.repository }}/issues/1/comments" \
              -f body="Run ${{ github.run_id }} failed before producing output." >/dev/null || true
          fi

      - name: Upload WAR and logs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: infeara-sales-os-war
          path: backend/target/infeara-sales-os.war
          if-no-files-found: warn
          retention-days: 14

      - name: Stop Tomcat
        if: always()
        run: /opt/tomcat/bin/shutdown.sh 10 -force || true

  # ---------------------------------------------------------------------------
  # Windows: the same WAR, the same container version, a different host OS.
  #
  # Why this job exists: docs/operations/windows-deployment.md is only useful if it is
  # true. This runs the Windows procedure on a real windows-2022 host - install the
  # toolchain, build the WAR, provision MariaDB, deploy ROOT.war into Tomcat 11, load the
  # external configuration from ProgramData, and exercise the API - so the Windows guide
  # carries evidence instead of assertions.
  #
  # Differences from the Linux job, on purpose:
  #   * Tomcat is started with catalina.bat run (not a registered service): a GitHub runner
  #     has no interactive session for the Procrun service to attach a console to. The
  #     service path is documented and exercised by scripts/windows/host-app.ps1.
  #   * MariaDB is installed from Chocolatey instead of a service container, because
  #     Windows runners cannot run Linux container services.
  # ---------------------------------------------------------------------------
  build-and-host-windows:
    name: Build WAR, deploy to Tomcat 11 on Windows, smoke test
    runs-on: windows-2022
    timeout-minutes: 60

    env:
      TOMCAT_VERSION: "11.0.27"
      DB_HOST: 127.0.0.1
      DB_PORT: "3307"
      DB_NAME: infeara_sales
      DB_USER: infeara_app
      DB_PASSWORD: ci_app_password_windows
      BOOTSTRAP_ADMIN_EMAIL: ci-admin@infeara.local
      BOOTSTRAP_ADMIN_PASSWORD: CiOnly-Passw0rd!2026
      INFEARA_DATA: C:\ProgramData\Infeara
      CATALINA_HOME: C:\tomcat

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Toolchain versions
        shell: pwsh
        run: |
          java -version
          javac -version
          mvn -v
          node -v
          python --version
          [Environment]::OSVersion.VersionString
          Write-Host "JAVA_HOME=$env:JAVA_HOME"

      - name: Prove the Windows deployment scripts parse
        shell: pwsh
        run: |
          # A syntax error in a .ps1 is the most likely first failure on a new platform,
          # so it is checked explicitly rather than discovered mid-deployment.
          $failed = 0
          Get-ChildItem scripts\windows\*.ps1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed++
              Write-Host "::error file=$($_.FullName)::$($errors[0].Message) (line $($errors[0].Extent.StartLineNumber))"
              $errors | ForEach-Object { Write-Host "  $($_.Extent.StartLineNumber): $($_.Message)" }
            } else {
              Write-Host "OK  $($_.Name)"
            }
          }
          if ($failed -gt 0) { exit 1 }

      - name: Frontend type-check, unit tests and static export
        shell: pwsh
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npx vitest run
          npm run build

      - name: Build the WAR
        shell: pwsh
        working-directory: backend
        run: mvn -B -DskipTests clean package

      - name: Backend unit and architecture tests
        shell: pwsh
        working-directory: backend
        run: mvn -B test

      - name: Verify the packaging contract
        shell: pwsh
        run: |
          $war = 'backend\target\infeara-sales-os.war'
          if (-not (Test-Path $war)) { throw "WAR not found: $war" }
          python scripts\verify-war.py $war
          if ($LASTEXITCODE -ne 0) { throw 'Packaging contract failed' }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $war dist\infeara-sales-os.war -Force
          Copy-Item $war dist\ROOT.war -Force

      - name: Install and configure MariaDB 11.4 (portable, port 3307)
        shell: pwsh
        run: |
          # Deterministic by design: the runner image ships a MySQL server that already owns
          # port 3306 and the "MySQL" service name, so an installed MariaDB would fight it.
          # A portable ZIP on its own port and data directory cannot collide with anything.
          #
          # Every command appends to C:\ci-diag.log, which the diagnostics step publishes -
          # the runner's log archive is not always reachable, so failures must be readable.
          $ErrorActionPreference = 'Stop'
          $diag = 'C:\ci-diag.log'
          Set-Content -Path $diag -Value "MariaDB provisioning $(Get-Date -Format o)" -Encoding ASCII
          function Step([string]$message) {
            $line = "[maria] $message"
            Write-Host $line
            Add-Content -Path $diag -Value $line -Encoding ASCII
          }

          $zip = 'C:\mariadb.zip'
          $url = 'https://archive.mariadb.org/mariadb-11.4.5/winx64-packages/mariadb-11.4.5-winx64.zip'
          Step "downloading $url"
          try {
            Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing -MaximumRedirection 5
            Step "downloaded $([math]::Round((Get-Item $zip).Length / 1MB, 1)) MB"
          } catch {
            Step "download failed: $($_.Exception.Message)"
            throw
          }

          Expand-Archive -Path $zip -DestinationPath C:\mariadb-extract -Force
          $inner = Get-ChildItem C:\mariadb-extract -Directory | Select-Object -First 1
          if (-not $inner) { throw 'The MariaDB archive contained no directory' }
          Move-Item $inner.FullName C:\mariadb
          Step "unpacked to C:\mariadb ($($inner.Name))"

          Step ((& C:\mariadb\bin\mariadbd.exe --version 2>&1) -join ' ')
          Step "bin contents: $((Get-ChildItem C:\mariadb\bin -Filter 'maria*' | Select-Object -ExpandProperty Name) -join ', ')"

          # Initialise a data directory. Deliberately NO server options here: mariadb-install-db
          # forwards unknown arguments to mysqld --bootstrap, which then aborts.
          $install = & C:\mariadb\bin\mariadb-install-db.exe --datadir=C:\mariadb-data --password= 2>&1
          $install | ForEach-Object { Add-Content -Path $diag -Value $_ -Encoding ASCII }
          $install | Select-Object -Last 6 | ForEach-Object { Write-Host $_ }
          Step "mariadb-install-db exit=$LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { throw "mariadb-install-db failed with $LASTEXITCODE" }

          # Server options belong on the server command line, not on the initialiser.
          $server = Start-Process -FilePath C:\mariadb\bin\mariadbd.exe `
            -ArgumentList '--datadir=C:\mariadb-data','--port=3307','--console',
                          '--default-time-zone=+00:00','--character-set-server=utf8mb4',
                          '--collation-server=utf8mb4_unicode_ci','--bind-address=127.0.0.1',
                          '--skip-name-resolve' `
            -RedirectStandardOutput C:\mariadb-server.out -RedirectStandardError C:\mariadb-server.err `
            -PassThru -WindowStyle Hidden
          $server.Id | Out-File C:\mariadb.pid -Encoding ASCII
          Step "mariadbd started, PID $($server.Id)"

          $client = 'C:\mariadb\bin\mariadb.exe'
          $ready = $false
          for ($i = 0; $i -lt 60; $i++) {
            & $client --protocol=TCP -h 127.0.0.1 -P 3307 -u root -e 'SELECT 1' 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) { Step "accepting connections after $i s"; $ready = $true; break }
            Start-Sleep -Seconds 1
          }
          if (-not $ready) {
            foreach ($f in @('C:\mariadb-server.err','C:\mariadb-server.out')) {
              if (Test-Path $f) {
                Add-Content -Path $diag -Value "---- $f ----" -Encoding ASCII
                Get-Content $f -Tail 40 | ForEach-Object { Add-Content -Path $diag -Value $_ -Encoding ASCII }
              }
            }
            throw 'MariaDB did not start on port 3307'
          }

          Step ((& $client --protocol=TCP -h 127.0.0.1 -P 3307 -u root -e "SELECT VERSION() AS v, @@character_set_server AS cs, @@collation_server AS coll, @@time_zone AS tz;" 2>&1) -join ' ')

          # Users are created for both 127.0.0.1 and localhost: the JDBC driver connects over TCP,
          # the CLI may not, and MySQL/MariaDB treat them as distinct accounts.
          $sql = @"
          CREATE DATABASE IF NOT EXISTS infeara_sales CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          CREATE USER IF NOT EXISTS 'infeara_app'@'127.0.0.1' IDENTIFIED BY '$env:DB_PASSWORD';
          CREATE USER IF NOT EXISTS 'infeara_app'@'localhost' IDENTIFIED BY '$env:DB_PASSWORD';
          GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, ALTER, INDEX, REFERENCES ON infeara_sales.* TO 'infeara_app'@'127.0.0.1';
          GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, ALTER, INDEX, REFERENCES ON infeara_sales.* TO 'infeara_app'@'localhost';
          FLUSH PRIVILEGES;
          "@
          [System.IO.File]::WriteAllText('C:\mariadb-grant.sql', $sql, (New-Object System.Text.UTF8Encoding($false)))
          & $client --protocol=TCP -h 127.0.0.1 -P 3307 -u root -e "source C:/mariadb-grant.sql"
          Step "grant exit=$LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { throw 'Database provisioning failed' }
          & $client --protocol=TCP -h 127.0.0.1 -P 3307 -u infeara_app "-p$env:DB_PASSWORD" -e "SHOW DATABASES;" |
            Select-String 'infeara_sales' | ForEach-Object { Step "verified: $_" }
          Step 'database ready (utf8mb4, +00:00, least-privilege application user)'

      - name: Install Apache Tomcat 11
        shell: pwsh
        run: |
          $url = "https://archive.apache.org/dist/tomcat/tomcat-11/v$env:TOMCAT_VERSION/bin/apache-tomcat-$env:TOMCAT_VERSION-windows-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile C:\tomcat.zip -UseBasicParsing
          Expand-Archive C:\tomcat.zip -DestinationPath C:\tomcat-extract -Force
          $inner = Get-ChildItem C:\tomcat-extract -Directory | Select-Object -First 1
          Move-Item $inner.FullName C:\tomcat
          foreach ($w in @('manager','host-manager','docs','examples','ROOT')) {
            $p = Join-Path $env:CATALINA_HOME "webapps\$w"
            if (Test-Path $p) { Remove-Item -Recurse -Force $p }
          }
          & "$env:CATALINA_HOME\bin\version.bat" | Select-String 'Server version|JVM Version'

      - name: Write the external configuration (outside the WAR)
        shell: pwsh
        run: |
          # This is the deployment model documented for Windows: credentials and tuning live in
          # ProgramData, not in the artefact. Forward slashes only - a backslash is an escape
          # character in .properties files, so "C:\log" becomes "C:log" with no error at all.
          $conf  = Join-Path $env:INFEARA_DATA 'conf'
          $logs  = Join-Path $env:INFEARA_DATA 'logs'
          New-Item -ItemType Directory -Force -Path $conf, $logs | Out-Null
          $confPosix = $conf.Replace('\', '/')
          $logsPosix = $logs.Replace('\', '/')

          # 32 random bytes, base64: exactly the AES-256-GCM key material the app expects.
          $keyBytes = [byte[]]::new(32)
          [System.Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($keyBytes)
          $encKey = [Convert]::ToBase64String($keyBytes)

          $props = @"
          spring.datasource.url=jdbc:mariadb://$($env:DB_HOST):$($env:DB_PORT)/$($env:DB_NAME)?useUnicode=true&characterEncoding=utf8
          spring.datasource.username=$($env:DB_USER)
          spring.datasource.password=$($env:DB_PASSWORD)
          spring.jpa.properties.hibernate.jdbc.batch_size=30
          spring.jpa.properties.hibernate.order_inserts=true
          spring.jpa.properties.hibernate.jdbc.time_zone=UTC
          app.security.encryption-key=$encKey
          app.security.encryption-key-id=k1
          app.security.cookie-secure=auto
          app.base-url=http://localhost:8080
          app.environment=production
          app.bootstrap.admin-email=$($env:BOOTSTRAP_ADMIN_EMAIL)
          app.bootstrap.admin-password=$($env:BOOTSTRAP_ADMIN_PASSWORD)
          app.worker.enabled=true
          "@
          $lprops = @"
          logging.file.name=$logsPosix/sales-os.log
          logging.logback.rollingpolicy.max-file-size=20MB
          logging.logback.rollingpolicy.max-history=7
          logging.level.com.infeara.sales=INFO
          "@
          $props += "`nserver.tomcat.accesslog.directory=$logsPosix/access`n"

          # UTF-8 WITHOUT BOM: java.util.Properties does not strip a BOM and PowerShell 5.1's
          # -Encoding UTF8 writes one, which would silently rename the first key.
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText((Join-Path $conf 'infeara.properties'), $props, $utf8)
          [System.IO.File]::WriteAllText((Join-Path $conf 'logs.properties'), $lprops, $utf8)

          Write-Host "configuration written to $confPosix"
          Get-Content (Join-Path $conf 'infeara.properties') |
            Where-Object { $_ -notmatch 'password|encryption-key=' }   # never print secrets

          # Values the next step needs; GitHub job env does not persist between steps, so they
          # are written to a small file the deployment step reads.
          @{ conf = $confPosix; logs = $logsPosix } | ConvertTo-Json |
            Set-Content -Path C:\infeara-conf.json -Encoding ASCII

      - name: Exclude deployment paths from Windows Defender
        shell: pwsh
        run: |
          # Not a convenience: on-access scanning of a 75 MB WAR and its 101 extracted jars is
          # the single largest cost of a first start on Windows, and it can push a cold start
          # past any sane health timeout. The production guidance says the same (see
          # docs/operations/windows-deployment.md).
          try {
            Add-MpPreference -ExclusionPath 'C:\tomcat', $env:INFEARA_DATA, 'C:\mariadb-data'
            Write-Host 'Defender exclusions added'
          } catch {
            Write-Host "Could not add Defender exclusions: $($_.Exception.Message)"
          }

      - name: Deploy ROOT.war and start Tomcat
        shell: pwsh
        run: |
          $paths = Get-Content C:\infeara-conf.json -Raw | ConvertFrom-Json
          Copy-Item dist\ROOT.war "$env:CATALINA_HOME\webapps\ROOT.war" -Force

          # CRLF is required: catalina.bat is parsed by cmd.exe. -Encoding ASCII keeps it plain.
          $setenv = @"
          @echo off
          set "JAVA_HOME=$env:JAVA_HOME"
          set "CATALINA_OPTS=-Xms512m -Xmx1536m -Dfile.encoding=UTF-8 -Duser.timezone=UTC"
          set "SPRING_PROFILES_ACTIVE=prod"
          set "SPRING_CONFIG_ADDITIONAL_LOCATION=file:$($paths.conf)/infeara.properties,file:$($paths.logs)/logs.properties"
          "@
          Set-Content -Path "$env:CATALINA_HOME\bin\setenv.bat" -Value $setenv -Encoding ASCII
          Get-Content "$env:CATALINA_HOME\bin\setenv.bat"

          New-Item -ItemType Directory -Force -Path C:\tomcat-logs | Out-Null
          # catalina.bat run blocks, so it is started detached with its output redirected.
          $process = Start-Process -FilePath "$env:CATALINA_HOME\bin\catalina.bat" -ArgumentList 'run' `
            -RedirectStandardOutput C:\tomcat-logs\console.log -RedirectStandardError C:\tomcat-logs\stderr.log `
            -PassThru -WindowStyle Hidden
          Write-Host "Tomcat PID $($process.Id)"
          $process.Id | Out-File C:\tomcat-logs\tomcat.pid -Encoding ASCII

      - name: Wait for /actuator/health
        shell: pwsh
        run: |
          $healthy = $false
          for ($i = 0; $i -lt 300; $i++) {
            try {
              $r = Invoke-WebRequest 'http://localhost:8080/actuator/health' -UseBasicParsing -TimeoutSec 5
              if ($r.Content -match '"status":"UP"') { Write-Host "HEALTH UP after $i s"; Write-Host $r.Content; $healthy = $true; break }
              if ($i % 20 -eq 0) { Write-Host "[${i}s] health responded but not UP: $($r.StatusCode) $($r.Content)" }
            } catch {
              $code = $_.Exception.Response.StatusCode.value__
              if ($i % 20 -eq 0) {
                $body = ''
                try {
                  $stream = $_.Exception.Response.GetResponseStream()
                  if ($stream) { $body = (New-Object System.IO.StreamReader($stream)).ReadToEnd() }
                } catch { }
                Write-Host "[${i}s] not ready: code=$code $($_.Exception.Message) $body"
              }
            }
            Start-Sleep -Seconds 1
          }
          if (-not $healthy) {
            $today = Get-Date -Format 'yyyy-MM-dd'
            foreach ($f in @("C:\tomcat\logs\localhost.$today.log", "C:\tomcat\logs\catalina.$today.log",
                             'C:\ProgramData\Infeara\logs\sales-os.log')) {
              Write-Host "---- $f ----"
              Get-Content $f -Tail 60 -ErrorAction SilentlyContinue
            }
            Write-Host '---- listeners ----'
            Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue |
              Where-Object { $_.LocalPort -in 8080, 3307 } | Format-Table -AutoSize
            throw 'Application did not become healthy'
          }

      - name: Smoke test the deployed WAR (UI + API + OpenAPI)
        shell: pwsh
        run: |
          function Get-Code([string]$Url) {
            try { return (Invoke-WebRequest $Url -UseBasicParsing -TimeoutSec 15).StatusCode }
            catch { return $_.Exception.Response.StatusCode.value__ }
          }
          $results = @()
          foreach ($path in @('/', '/leads/', '/engagement/mailbox/', '/login/', '/v3/api-docs')) {
            $code = Get-Code "http://localhost:8080$path"
            $results += [pscustomobject]@{ Path = $path; Expected = 200; Actual = $code; Pass = ($code -eq 200) }
          }
          $meCode = Get-Code 'http://localhost:8080/api/v1/auth/me'
          $results += [pscustomobject]@{ Path = '/api/v1/auth/me'; Expected = 401; Actual = $meCode; Pass = ($meCode -eq 401) }
          $results | Format-Table -AutoSize
          $results | ForEach-Object { if ($_.Pass) { Write-Host "[PASS] $($_.Path) -> $($_.Actual)" } else { Write-Host "::error::$($_.Path) expected $($_.Expected), got $($_.Actual)" } }
          if ($results.Where({ -not $_.Pass }).Count -gt 0) { exit 1 }
          # The 401 must be the API's own error envelope, not an IIS/Tomcat error page.
          try { Invoke-WebRequest 'http://localhost:8080/api/v1/auth/me' -UseBasicParsing | Out-Null }
          catch {
            $body = (New-Object System.IO.StreamReader($_.Exception.Response.GetResponseStream())).ReadToEnd()
            Write-Host "401 body: $body"
            if ($body -notmatch '"success":false' -or $body -notmatch 'UNAUTHENTICATED') { throw 'Unexpected 401 body' }
          }
          $openapi = (Invoke-WebRequest 'http://localhost:8080/v3/api-docs' -UseBasicParsing).Content
          $pathCount = ([regex]::Matches($openapi, '"\/api\/')).Count
          Write-Host "OpenAPI paths detected: $pathCount"
          if ($pathCount -lt 90) { throw "Unexpected OpenAPI path count: $pathCount" }

      - name: Authenticated smoke test on Windows
        shell: pwsh
        run: |
          python scripts\smoke-authenticated.py --base-url http://localhost:8080 `
            --email "$env:BOOTSTRAP_ADMIN_EMAIL" --password "$env:BOOTSTRAP_ADMIN_PASSWORD"
          if ($LASTEXITCODE -ne 0) { throw 'Authenticated smoke test failed' }

      - name: Deployed schema inventory
        shell: pwsh
        run: |
          $client = 'C:\mariadb\bin\mariadb.exe'
          & $client --protocol=TCP -h 127.0.0.1 -P 3307 -u root -e "SELECT version, success FROM infeara_sales.flyway_schema_history ORDER BY installed_rank;"
          & $client --protocol=TCP -h 127.0.0.1 -P 3307 -u root -e "SELECT COUNT(*) AS tables_total FROM information_schema.tables WHERE table_schema='infeara_sales';"
          & $client --protocol=TCP -h 127.0.0.1 -P 3307 -u root -e "SELECT COUNT(*) AS users FROM infeara_sales.users;"

      - name: Collect Windows diagnostics
        if: failure()
        shell: pwsh
        run: |
          # The runner's raw logs are not always retrievable from this environment, so the
          # failure detail is published where it can be read: the job summary and issue #1.
          $report = @()
          $report += "### Windows deployment diagnostics - run $env:GITHUB_RUN_ID ($env:GITHUB_SHA)"
          $report += ''
          foreach ($pair in @(
              @{ Title = 'ci-diag.log'; Path = 'C:\ci-diag.log' },
              @{ Title = 'mariadb-server.err'; Path = 'C:\mariadb-server.err' },
              @{ Title = 'tomcat console.log'; Path = 'C:\tomcat-logs\console.log' },
              @{ Title = 'tomcat stderr.log'; Path = 'C:\tomcat-logs\stderr.log' })) {
            if (Test-Path $pair.Path) {
              $report += "#### $($pair.Title)"
              $report += '```'
              $report += (Get-Content $pair.Path -Tail 80 -ErrorAction SilentlyContinue) -join "`n"
              $report += '```'
            }
          }
          # Tomcat's own log files are complete: redirected stdout is buffered and truncated
          # when the process is killed, which hides the real startup error.
          foreach ($dir in @('C:\tomcat\logs', (Join-Path $env:INFEARA_DATA 'logs'))) {
            if (-not (Test-Path $dir)) { continue }
            Get-ChildItem $dir -Filter '*.log' -File -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending | Select-Object -First 4 | ForEach-Object {
                $report += "#### $($_.FullName) ($($_.Length) bytes)"
                $report += '```'
                $report += (Get-Content $_.FullName -Tail 100 -ErrorAction SilentlyContinue) -join "`n"
                $report += '```'
              }
          }
          $report += '#### deployment state'
          $report += '```'
          $report += "ROOT.war present: $(Test-Path 'C:\tomcat\webapps\ROOT.war')"
          $report += "ROOT exploded:    $(Test-Path 'C:\tomcat\webapps\ROOT')"
          $report += '--- setenv.bat ---'
          $report += ((Get-Content 'C:\tomcat\bin\setenv.bat' -ErrorAction SilentlyContinue) -join "`n")
          $report += '--- infeara.properties (secrets removed) ---'
          $report += ((Get-Content (Join-Path $env:INFEARA_DATA 'conf\infeara.properties') -ErrorAction SilentlyContinue) -join "`n")
          $report += '```'
          $report += '#### environment'
          $report += '```'
          $report += "DB_PORT=$env:DB_PORT JAVA_HOME=$env:JAVA_HOME"
          $report += '```'
          $text = $report -join "`n"
          $text | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding UTF8
          $file = 'C:\windows-report.md'
          [System.IO.File]::WriteAllText($file, $text, (New-Object System.Text.UTF8Encoding($false)))
          gh api "repos/${{ github.repository }}/issues/1/comments" -F "body=@C:\windows-report.md" | Out-Null
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish the Windows report
        if: always()
        shell: pwsh
        run: |
          $summary = @()
          $summary += '### Windows deployment (windows-2022)'
          $summary += ''
          try {
            $version = (& "$env:CATALINA_HOME\bin\version.bat" 2>&1 | Select-String 'Server version' | Select-Object -First 1)
            $summary += "- Tomcat: $version"
          } catch { $summary += '- Tomcat: version unknown' }
          try {
            $health = (Invoke-WebRequest 'http://localhost:8080/actuator/health' -UseBasicParsing -TimeoutSec 5).Content
            $summary += "- Health: ``$health``"
          } catch { $summary += '- Health: unreachable' }
          try {
            $uiCode = (Invoke-WebRequest 'http://localhost:8080/' -UseBasicParsing -TimeoutSec 10).StatusCode
            $summary += "- UI /: $uiCode"
          } catch { $summary += '- UI /: error' }
          $summary += ''
          $summary += '```'
          $summary += ((Get-Content 'C:\tomcat-logs\console.log' -Tail 30 -ErrorAction SilentlyContinue) -join "`n")
          $summary += '```'
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding UTF8

      - name: Upload Windows logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-deployment-logs
          path: |
            C:\tomcat-logs\*.log
            C:\ProgramData\Infeara\logs\*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop Tomcat and MariaDB
        if: always()
        shell: pwsh
        run: |
          # Cleanup failures must never mask the real result of the job.
          try {
            if (Test-Path C:\tomcat-logs\tomcat.pid) {
              $tomcatPid = (Get-Content C:\tomcat-logs\tomcat.pid | Select-Object -First 1).Trim()
              Get-Process -Id $tomcatPid -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            }
            Get-Process java -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            if (Test-Path C:\mariadb.pid) {
              $mariaPid = (Get-Content C:\mariadb.pid | Select-Object -First 1).Trim()
              Get-Process -Id $mariaPid -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            }
          } catch {
            Write-Host "cleanup: $($_.Exception.Message)"
          }
          exit 0
