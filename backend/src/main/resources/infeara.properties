# =============================================================================
# Infeara Sales OS - in-WAR configuration (EDIT THIS FILE, THEN RESTART TOMCAT)
# =============================================================================
#
# This file is packaged inside the WAR at:
#
#     WEB-INF/classes/infeara.properties
#
# and is loaded by Spring Boot at startup (see application.yml:
# spring.config.import=optional:classpath:/infeara.properties). Values here win
# over the defaults in application.yml / application-prod.yml.
#
# HOW TO SET THE KEYS MANUALLY
# ----------------------------
# Option A - edit the deployed (exploded) web application, no rebuild:
#     1. stop Tomcat:            bin/shutdown.sh   (Windows: Stop-Service InfearaSalesOS)
#     2. edit                   $CATALINA_BASE/webapps/ROOT/WEB-INF/classes/infeara.properties
#     3. start Tomcat:           bin/startup.sh
#   Tomcat keeps the exploded copy, so the edit survives restarts but NOT a WAR
#   redeploy - keep your own copy of the edited file.
#
# Option B - patch the WAR itself (survives redeploy):
#     scripts/configure-war.py dist/infeara-sales-os.war \
#         --set spring.datasource.password='...' \
#         --set app.security.encryption-key='...' \
#         --set app.ai.openrouter.api-key='...'
#   Add --print to show every key without changing anything.
#
# Option C - environment variables (highest precedence, best for automation):
#   every value below that is written as ${SOME_ENV_VAR:} is resolved from the
#   environment first, so a container/CI can keep using variables while a manual
#   install sets literal values here.
#
# SECURITY
# --------
# While these values are placeholders (${VAR:}), the file contains no secret and the
# WAR is a distributable artefact. As soon as you write a real password or key here,
# that WAR contains a credential:
#   * keep it out of git (backend/target and dist/ are already ignored)
#   * do not upload it as a build artifact or copy it to a shared drive
#   * restrict the file: chmod 600, or on Windows
#       icacls ...\WEB-INF\classes\infeara.properties /inheritance:r ^
#              /grant:r "InfearaSalesOS:(R)" /grant:r "Administrators:(F)"
#   * prefer a secret manager + Option B at deploy time when you can
#
# Paths in this file use FORWARD SLASHES. A backslash is an escape character in
# .properties files: C:\app\log silently becomes C:applog.
# =============================================================================

# --- Database (MariaDB 11.4) ------------------------------------------------
# Leave as ${...} to keep taking the values from the environment (DB_HOST etc.).
spring.datasource.url=${DB_URL:jdbc:mariadb://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:infeara_sales}?useUnicode=true&characterEncoding=utf8&useServerPrepStmts=true&useBulkStmts=false&connectTimeout=5000&socketTimeout=30000}
spring.datasource.username=${DB_USER:infeara_app}
spring.datasource.password=${DB_PASSWORD:}

# --- Hibernate / JPA --------------------------------------------------------
# Spring Boot builds the JPA service registry itself, so Hibernate's own
# hibernate.properties is never read. These are the supported equivalents.
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true

# --- Credential encryption (AES-256-GCM, base64 of exactly 32 bytes) --------
# Generate: openssl rand -base64 32
# Losing this key means every stored SMTP/IMAP/Calendly secret must be re-entered.
app.security.encryption-key=${SMTP_SECRET_ENCRYPTION_KEY:}
app.security.encryption-key-id=${SMTP_SECRET_ENCRYPTION_KEY_ID:k1}
app.security.previous-encryption-keys=${SMTP_SECRET_PREVIOUS_KEYS:}
# auto = mark the session cookie Secure only when the request arrived over TLS
# (correct behind IIS/nginx). "always" behind a plain-HTTP connector makes every
# authenticated request return 401.
app.security.cookie-secure=${APP_SECURITY_COOKIE_SECURE:auto}

# --- Application ------------------------------------------------------------
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.environment=${APP_ENV:production}
app.timezone=${APP_TIMEZONE:Asia/Kolkata}
server.forward-headers-strategy=native

# --- First-run administrator ------------------------------------------------
# Used only while the workspace has no users. Change the password at first login.
app.bootstrap.workspace-name=${BOOTSTRAP_WORKSPACE_NAME:Infeara Technologies}
app.bootstrap.workspace-slug=${BOOTSTRAP_WORKSPACE_SLUG:infeara}
app.bootstrap.workspace-timezone=${BOOTSTRAP_WORKSPACE_TIMEZONE:Asia/Kolkata}
app.bootstrap.admin-email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.admin-display-name=${BOOTSTRAP_ADMIN_NAME:Workspace Administrator}

# --- Durable worker (outbox relay, job engine, email dispatcher, inbound) ---
app.worker.enabled=${WORKER_ENABLED:true}

# --- AI providers ------------------------------------------------------------
# Empty key = analysis is reported unavailable (AI_PROVIDER_UNAVAILABLE).
# There is no mock provider: no key means no fabricated classification.
app.ai.preferred-provider=${AI_PREFERRED_PROVIDER:OPENROUTER}
app.ai.openrouter.api-key=${AI_OPENROUTER_API_KEY:}
app.ai.openrouter.model=${AI_OPENROUTER_MODEL:openai/gpt-4o-mini}
app.ai.openai.api-key=${AI_OPENAI_API_KEY:}
app.ai.openai.model=${AI_OPENAI_MODEL:gpt-4o-mini}
app.ai.timeout-seconds=${AI_TIMEOUT_SECONDS:30}

# --- Inbound mailbox limits (two-way email) ---------------------------------
app.email.inbound.discovery-interval-ms=${EMAIL_INBOUND_DISCOVERY_INTERVAL_MS:60000}
app.email.inbound.max-body-chars=${EMAIL_INBOUND_MAX_BODY_CHARS:200000}
app.email.inbound.max-attachment-bytes=${EMAIL_INBOUND_MAX_ATTACHMENT_BYTES:10485760}
app.email.inbound.max-attachments-per-message=${EMAIL_INBOUND_MAX_ATTACHMENTS:20}
app.email.inbound.max-messages-per-sync=${EMAIL_INBOUND_MAX_MESSAGES_PER_SYNC:50}
app.email.inbound.business-hours-start=${EMAIL_BUSINESS_HOURS_START:09:00}
app.email.inbound.business-hours-end=${EMAIL_BUSINESS_HOURS_END:18:00}

# --- Logging ----------------------------------------------------------------
# Uncomment and set these to write a rolled log file. Paths use forward slashes;
# a relative path resolves against Tomcat's working directory, so an absolute
# path is clearer for a service:
#     /var/log/infeara/sales-os.log        (Linux)
#     C:/ProgramData/Infeara/logs/sales-os.log   (Windows)
# Rotation is size + history based; for daily rotation as well, point
# logging.config at a logback-spring.xml (deploy/windows/logback-spring.xml.example).
#
# logging.file.name=/var/log/infeara/sales-os.log
# logging.logback.rollingpolicy.file-name-pattern=${LOG_FILE_NAME}.%d{yyyy-MM-dd}.%i.gz
logging.logback.rollingpolicy.max-file-size=${LOG_MAX_FILE_SIZE:50MB}
logging.logback.rollingpolicy.max-history=${LOG_MAX_HISTORY:30}
logging.logback.rollingpolicy.total-size-cap=${LOG_TOTAL_SIZE_CAP:2GB}
logging.level.root=${LOG_LEVEL_ROOT:WARN}
logging.level.com.infeara.sales=${LOG_LEVEL_APP:INFO}
logging.pattern.file=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId:-}] [%X{workspaceId:-}] %logger{36} - %msg%n

# --- Tomcat access log (served by the container inside the WAR's context) ---
server.tomcat.accesslog.enabled=${ACCESS_LOG_ENABLED:false}
server.tomcat.accesslog.directory=${ACCESS_LOG_DIR:logs}
server.tomcat.accesslog.pattern=%h %l %u %t "%r" %s %b %D
