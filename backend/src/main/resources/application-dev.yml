spring:
  datasource:
    url: jdbc:mariadb://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:infeara_sales}?useUnicode=true&characterEncoding=utf8
    username: ${DB_USER:infeara_app}
    password: ${DB_PASSWORD:infeara_dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
server:
  servlet:
    session:
      cookie:
        secure: false
app:
  environment: development
  base-url: ${APP_BASE_URL:http://localhost:8080}
logging:
  level:
    com.infeara.sales: DEBUG
