spring:
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        generate_statistics: false
server:
  # The connector is plain HTTP behind the TLS-terminating proxy; parse Forwarded/X-Forwarded-*
  # so request.isSecure() and RemoteIp reflect the real client and scheme.
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        secure: true
  tomcat:
    accesslog:
      enabled: true
      directory: /var/log/tomcat/access
      pattern: "%h %l %u %t \"%r\" %s %b %D"
app:
  environment: production
logging:
  level:
    root: WARN
    com.infeara.sales: INFO
