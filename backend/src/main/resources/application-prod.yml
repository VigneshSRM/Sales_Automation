spring:
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        generate_statistics: false
server:
  servlet:
    session:
      cookie:
        secure: true
  tomcat:
    accesslog:
      enabled: true
      directory: /var/log/tomcat/access
      pattern: "%h %l %u %t \"%r\" %s %b %D"
app:
  environment: production
logging:
  level:
    root: WARN
    com.infeara.sales: INFO
